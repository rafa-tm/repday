<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepDay — sem conexão</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0a0a0a; --muted: #737373; --border: #e5e5e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --border: #262626; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 320px; }
      svg { width: 64px; height: 64px; }
      h1 { margin: 8px 0 0; font-size: 20px; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--fg); color: var(--bg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <g stroke="#0ea5e9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.72 11.9A12 12 0 0 1 27.28 11.9"/>
    <path d="M29.18 7.82 27.28 11.9 24.38 10.55"/>
    <path d="M27.28 20.1A12 12 0 0 1 4.72 20.1"/>
    <path d="M2.82 24.18 4.72 20.1 7.62 21.45"/>
  </g>
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <path d="M21.8 16h1.8M10.2 16H8.4M16 21.8v1.8M16 10.2V8.4M20.1 20.1l1.27 1.27M11.9 20.1l-1.27 1.27M11.9 11.9l-1.27-1.27M20.1 11.9l1.27-1.27"/>
  </g>
  <circle cx="16" cy="16" r="3.9" fill="#f59e0b"/>
      </svg>
      <h1>Sem conexão</h1>
      <p>O RepDay precisa de internet para registrar e mostrar suas doses. Assim que a conexão voltar, é só tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
